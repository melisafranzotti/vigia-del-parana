name: descubrir-estaciones
on:
  push:
    branches: [descubrir]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probar series
        run: |
          exec > descubrir2.txt 2>&1
          for s in 39 40 41 42 49 52 53 54 85 26202 29580; do
            echo "=== $s"; curl -s -m 60 "https://alerta.ina.gob.ar/a5/getObservaciones?tipo=puntual&series_id=$s&timestart=2026-10-05&timeend=2026-10-17&format=csvless&no_id=true" | tail -n 12
          done
          echo "=== largo 85"; curl -s -m 90 "https://alerta.ina.gob.ar/a5/getObservaciones?tipo=puntual&series_id=85&timestart=2023-01-01&timeend=2026-10-17&format=csvless&no_id=true" | wc -l
      - name: Guardar
        if: always()
        run: |
          git config user.name vigia-bot; git config user.email vigia-bot@users.noreply.github.com
          git rm -q --cached series.json descubrir.txt || true
          git add descubrir2.txt && git commit -m "resultado 2 [skip ci]" && git push origin descubrir
