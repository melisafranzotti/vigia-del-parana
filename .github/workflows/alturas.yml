name: Actualizar alturas (INA)

on:
  schedule:
    # Cada hora, al minuto 17. GitHub demora u omite los crons en horas pico
    # (ayer una corrida salió 3 h tarde), así que se corre seguido: si el INA no
    # cambió nada, el script termina en "sin cambios" y no hay commit.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  alturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar alturas del INA
        run: python scripts/fetch_alturas.py
      - name: Publicar
        run: |
          git config user.name "vigia-bot"
          git config user.email "vigia-bot@users.noreply.github.com"
          git add data/alturas.json
          git diff --cached --quiet && echo "sin cambios" && exit 0
          git commit -m "datos: alturas $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
