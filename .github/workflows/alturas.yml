name: Actualizar alturas (INA)

on:
  schedule:
    # 07:20 y 19:20 hora Argentina (UTC-3)
    - cron: "20 10,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  alturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar alturas del INA
        run: python scripts/fetch_alturas.py
      - name: Publicar
        run: |
          git config user.name "vigia-bot"
          git config user.email "vigia-bot@users.noreply.github.com"
          git add data/alturas.json
          git diff --cached --quiet && echo "sin cambios" && exit 0
          git commit -m "datos: alturas $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
